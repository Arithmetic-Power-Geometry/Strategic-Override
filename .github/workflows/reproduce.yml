name: Reproduce Complete Strategic Override Study
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Reproduce all outputs
        run: python reproduce.py
      - name: Verify regenerated primary results
        run: python reproducibility/verify_reproduction.py
      - name: Upload complete outputs
        uses: actions/upload-artifact@v7
        with:
          name: strategic-override-complete-results
          path: results/
          if-no-files-found: error
